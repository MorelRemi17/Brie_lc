[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 demande Node >= 22.22
  NODE_VERSION = "22"

# Les fichiers générés par Astro ont un nom unique (hash) : cache long.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
